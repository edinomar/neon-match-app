
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Meta tags para Android / Chrome -->
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    
    <!-- Meta tags para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8243/8243058.png">

    <title>Neon Nebula Match-3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #020617;
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .neon-border {
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.3), inset 0 0 10px rgba(34, 211, 238, 0.2);
      }
      .neon-text-green {
        text-shadow: 0 0 10px rgba(74, 222, 128, 0.8);
      }
      .neon-text-pink {
        text-shadow: 0 0 10px rgba(236, 72, 153, 0.8);
      }
      .piece-shadow {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      }
      
      @keyframes pop-out {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); filter: brightness(1.5); }
        100% { transform: scale(0); opacity: 0; }
      }
      .animate-pop-out {
        animation: pop-out 0.4s ease-out forwards;
      }

      @keyframes board-shake {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-4px, 4px); }
        50% { transform: translate(4px, -4px); }
        75% { transform: translate(-4px, -4px); }
      }
      .animate-shake {
        animation: board-shake 0.3s ease-in-out;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
      
      @keyframes bounce-in {
        0% { transform: scale(0.3); opacity: 0; }
        50% { transform: scale(1.05); opacity: 1; }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); }
      }
      .animate-bounce-in {
        animation: bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes diamond-pulse {
        0% { transform: scale(1); filter: brightness(0.8) drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
        50% { transform: scale(1.05); filter: brightness(1.1) drop-shadow(0 0 12px rgba(255,255,255,0.6)); }
        100% { transform: scale(1); filter: brightness(0.8) drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
      }
      .animate-diamond {
        animation: diamond-pulse 2s infinite ease-in-out;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://esm.sh/lucide-react@^0.475.0",
        "react/": "https://esm.sh/react@^19.0.0/",
        "react": "https://esm.sh/react@^19.0.0",
        "react-dom/": "https://esm.sh/react-dom@^19.0.0/"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
